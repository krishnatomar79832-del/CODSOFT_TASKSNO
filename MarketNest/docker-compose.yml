services:
  postgres:
    image: postgres:16
    container_name: marketnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketnest
    ports: ["5432:5432"]
    volumes: [marketnest_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    container_name: marketnest-redis
    restart: unless-stopped
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    container_name: marketnest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes: [marketnest_minio:/data]
volumes:
  marketnest_pg:
  marketnest_minio:
